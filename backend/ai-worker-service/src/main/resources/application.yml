server:
  port: 8081

spring:
  application:
    name: ai-worker-service
  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/nexushire
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  kafka:
    bootstrap-servers: 127.0.0.1:9092

gemini:
  api:
    key: ${GEMINI_API_KEY:dummy-local-dev-key}
